services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pushhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushhub}
      POSTGRES_DB: pushhub
    volumes:
      - pushhub_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pushhub_net

  pushhub:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pushhub:${POSTGRES_PASSWORD:-pushhub}@postgres:5432/pushhub?sslmode=disable
      LISTEN_ADDR: ":8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # Admin web panel login (username/password + TOTP). Only used once, to create the
      # first admin account — after that, log in at /panel/ and these two can be removed.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-PushHub}
      # Set to "true" once PushHub is served over HTTPS (e.g. behind a reverse proxy with
      # a domain + SSL). Must stay "false" for plain-HTTP LAN/IP access like this deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Email channel (POST /send/email) — single hub-level SMTP account shared across all
      # tenants. Leave unset to disable the Email channel (/send/email will return an error).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Notification Hub}
      # CS Hub idle timeout (hours) — see CS Hub section below.
      CS_SESSION_IDLE_HOURS: ${CS_SESSION_IDLE_HOURS:-24}
      # CS Hub AI assistant ("AiSyah" by default) — answers new CS sessions automatically via
      # OpenAI until a staff member takes over from the panel ("Tangani"). Leave OPENAI_API_KEY
      # blank to disable it entirely — sessions still work, staff just answer every one manually.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_ASSISTANT_NAME: ${AI_ASSISTANT_NAME:-AiSyah}
      CS_AI_ENABLED: ${CS_AI_ENABLED:-true}
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      # Firebase service-account JSON key files for the FCM (Android push) channel — see
      # internal/fcmassist and migrations/0007_fcm.sql. Put a tenant's key file in ./secrets/ on
      # the HOST (this compose file's directory) and it shows up at /app/secrets/<name> INSIDE
      # the container; that in-container path is what apps.fcm_credentials_path (set via
      # POST /admin/apps/{slug}/fcm) must point to. Several tenants may point at the same file
      # when they share a Firebase project. Read-only: PushHub never writes here.
      - ./secrets:/app/secrets:ro
    networks:
      - pushhub_net

networks:
  pushhub_net:

volumes:
  pushhub_pgdata:
