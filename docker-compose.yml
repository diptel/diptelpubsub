services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pushhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushhub}
      POSTGRES_DB: pushhub
    volumes:
      - pushhub_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pushhub_net

  pushhub:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pushhub:${POSTGRES_PASSWORD:-pushhub}@postgres:5432/pushhub?sslmode=disable
      LISTEN_ADDR: ":8080"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # Admin web panel login (username/password + TOTP). Only used once, to create the
      # first admin account — after that, log in at /panel/ and these two can be removed.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-PushHub}
      # Set to "true" once PushHub is served over HTTPS (e.g. behind a reverse proxy with
      # a domain + SSL). Must stay "false" for plain-HTTP LAN/IP access like this deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Email channel (POST /send/email) — single hub-level SMTP account shared across all
      # tenants. Leave unset to disable the Email channel (/send/email will return an error).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Notification Hub}
    ports:
      - "${HOST_PORT:-8080}:8080"
    networks:
      - pushhub_net

networks:
  pushhub_net:

volumes:
  pushhub_pgdata:
